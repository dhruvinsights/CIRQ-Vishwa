[build]
  command   = "npm install && npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "22"
  # VITE_CARTO_API_KEY is a public read-only map tile key — not a credential.
  # Tell Netlify's secrets scanner to ignore it so it doesn't block the deploy.
  SECRETS_SCAN_OMIT_KEYS = "VITE_CARTO_API_KEY"
  # Suppress the __dirname native config-loader warning (fixed in vite.config.ts too)
  VITE_CONFIG_NATIVE_IGNORE_WARNING = "true"

# SPA fallback: all routes handled by index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
