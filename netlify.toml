[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION                    = "22"
  VITE_CONFIG_NATIVE_IGNORE_WARNING = "true"
  SECRETS_SCAN_ENABLED            = "false"

# SPA fallback: all routes handled by index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
